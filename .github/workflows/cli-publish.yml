name: Publish CLI

on:
  push:
    tags: ["cli-v*"]

# npm trusted publishing authenticates the workflow with an OIDC token: no npm token.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: cli
      - run: npm publish
        working-directory: cli
